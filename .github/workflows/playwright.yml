name: Playwright Tests

run-name: Playwright Tests - Build ${{ github.run_number }}

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: |
        playwright install --with-deps

    - name: Install Allure CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jre

        wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz

        tar -zxvf allure-2.34.1.tgz

        sudo mv allure-2.34.1 /opt/allure

        echo "/opt/allure/bin" >> $GITHUB_PATH

    - name: Run Playwright Tests
      run: |
        python utils/generate_reports.py

    - name: Verify Allure Results
      if: always()
      run: |
        echo "=== reports/run_*/allure-results ==="
        find reports -maxdepth 3 -type d -name 'allure-results' -print || true

    - name: Generate Allure Report
      if: always()
      run: |
        rm -rf allure-results allure-report site

        if [ -d "reports/run_*/allure-results" ]; then
          latest_run=$(ls -dt reports/run_* | head -1)
          allure generate "$latest_run/allure-results" -o "$latest_run/allure-report" --clean
        else
          echo "No Allure results found under reports/" >&2
          exit 1
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Test Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          reports/
        retention-days: 30

    - name: Publish Test Summary
      if: always()
      run: |
        latest_run=$(ls -dt reports/run_* | head -1)

        echo "# Playwright Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Workflow Run: $GITHUB_RUN_NUMBER" >> $GITHUB_STEP_SUMMARY
        echo "Commit: ${GITHUB_SHA:0:7}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f "$latest_run/summary.txt" ]; then
          cat "$latest_run/summary.txt" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Allure Report" >> $GITHUB_STEP_SUMMARY
        echo "Published to GitHub Pages after deployment." >> $GITHUB_STEP_SUMMARY

    - name: Prepare GitHub Pages Site
      if: always()
      run: |
        rm -rf site
        latest_run=$(ls -dt reports/run_* | head -1)

        mkdir -p site
        if [ -d "$latest_run/allure-report" ]; then
          cp -r "$latest_run/allure-report"/* site/
        else
          echo "No Allure report found in $latest_run" >&2
          exit 1
        fi

        cp "$latest_run/summary.txt" site/summary.txt
        cp "$latest_run/results.xml" site/results.xml

    - name: Upload GitHub Pages Artifact
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

    - name: Deploy to GitHub Pages
      if: always()
      id: deployment
      uses: actions/deploy-pages@v4